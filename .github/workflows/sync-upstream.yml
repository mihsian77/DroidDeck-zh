name: Sync upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # 白名单文件清单。改下面 case 那段时这里也要跟着改——这里只用来做丢弃检查。
    env:
      WHITELIST_FILES: |
        app/build.gradle
        app/src/main/java/com/droiddeck/launcher/FrontEndActivity.kt
        app/src/main/java/com/droiddeck/launcher/core/DownloadSource.kt
        app/src/main/java/com/droiddeck/launcher/core/MirrorHub.java
        app/src/main/java/com/droiddeck/launcher/session/SteamLogout.kt
        app/src/main/java/com/droiddeck/launcher/ui/FrontEndSetup.kt
        app/src/main/java/com/droiddeck/launcher/ui/UpdatesPage.kt
        tools/linuxfs/overlay/etc/fonts/conf.d/99-zh-fallback.conf
        tools/linuxfs/overlay/usr/share/fonts/truetype/wqy/wqy-microhei.ttc
        proton-seed.json
        app/src/main/res/values/strings.xml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Droid-Deck/DroidDeck.git 2>/dev/null || true
          git fetch upstream main

      - name: Check for new upstream commits
        id: check
        run: |
          set -euo pipefail
          BASE=$(git merge-base HEAD upstream/main)
          BEHIND=$(git rev-list --count "${BASE}..upstream/main")
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          if [ "$BEHIND" -eq 0 ]; then
            echo "No new upstream commits. Exiting."
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream is $BEHIND commits ahead."
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            UPSTREAM_SHA=$(git rev-parse --short upstream/main)
            echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
            DATE=$(date +%Y%m%d)
            echo "branch=auto-sync/upstream-${DATE}-${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"
            git log --oneline "${BASE}..upstream/main" > /tmp/upstream-commits.txt
            echo "commit_count=$BEHIND" >> "$GITHUB_OUTPUT"
          fi

      # 白名单是整文件保留 ours。上游这批提交里如果动了名单里的文件，冲突解决会把这些
      # 改动整段丢掉，而且合并成功、不报错。这里先把「会被丢掉什么」算出来，合并后打印。
      - name: Check whitelist drift
        if: steps.check.outputs.has_updates == 'true'
        run: |
          set -euo pipefail
          BASE=$(git merge-base HEAD upstream/main)
          : > /tmp/whitelist-drift.txt
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            stat=$(git diff --numstat "$BASE" upstream/main -- "$f" || true)
            [ -n "$stat" ] || continue
            echo "$f|$(echo "$stat" | awk '{a+=$1; d+=$2} END {printf "+%d -%d", a, d}')" >> /tmp/whitelist-drift.txt
          done <<< "$WHITELIST_FILES"
          if [ -s /tmp/whitelist-drift.txt ]; then
            echo "上游这批提交动了白名单里的文件："
            cat /tmp/whitelist-drift.txt
          else
            echo "上游这批提交没碰白名单文件"
          fi

      - name: Create sync branch and merge
        if: steps.check.outputs.has_updates == 'true'
        id: merge
        run: |
          set -euo pipefail
          BRANCH="${{ steps.check.outputs.branch }}"
          MERGE_BASE=$(git rev-parse HEAD)
          echo "MERGE_BASE=$MERGE_BASE" >> "$GITHUB_ENV"
          git checkout -b "$BRANCH"
          if git merge upstream/main --no-edit; then
            echo "merge_status=clean" >> "$GITHUB_OUTPUT"
          else
            echo "merge_status=conflict" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U > /tmp/conflict-files.txt || true
            # Auto-resolve conflicts:
            # - Our modified feature files: keep ours (we added features upstream doesn't have)
            # - Translation files: keep ours (we have more complete Chinese)
            # - Other files: take upstream version
            while IFS= read -r file; do
              # Files we intentionally modified - always keep our version
              case "$file" in
                app/build.gradle|\
                app/src/main/java/com/droiddeck/launcher/FrontEndActivity.kt|\
                app/src/main/java/com/droiddeck/launcher/core/DownloadSource.kt|\
                app/src/main/java/com/droiddeck/launcher/core/MirrorHub.java|\
                app/src/main/java/com/droiddeck/launcher/session/SteamLogout.kt|\
                app/src/main/java/com/droiddeck/launcher/ui/FrontEndSetup.kt|\
                app/src/main/java/com/droiddeck/launcher/ui/UpdatesPage.kt|\
                tools/linuxfs/overlay/etc/fonts/conf.d/99-zh-fallback.conf|\
                tools/linuxfs/overlay/usr/share/fonts/truetype/wqy/wqy-microhei.ttc|\
                proton-seed.json)
                  git checkout --ours "$file"
                  echo "RESOLVED (ours - feature): $file"
                  ;;
                *values-zh-rCN/strings.xml*|*values/strings.xml*)
                  git checkout --ours "$file"
                  echo "RESOLVED (ours - translation): $file"
                  ;;
                *)
                  git checkout --theirs "$file"
                  echo "RESOLVED (theirs): $file"
                  ;;
              esac
              git add "$file"
            done < /tmp/conflict-files.txt
            git -c core.editor=true commit --no-edit -m "sync: auto-merged upstream with conflict resolution" || \
              git commit --allow-empty -m "sync: auto-merged upstream"
          fi
          # workflow 一律保留我们的版本。App token 没有 workflows 权限，提交里只要带
          # 一处 workflow 变更，push 就会被 "refusing to allow a GitHub App to create
          # or update workflow" 拒掉——上游改 build.yml、publish-packs.yml 都会触发，
          # 所以不按名单挑，凡 base 里存在的 workflow 全部恢复成我们的。
          # 上游的 workflow 改动靠 fork-drift.yml 每周提醒，人工决定要不要移植。
          for f in $(git ls-tree --name-only "$MERGE_BASE" .github/workflows/ | sed 's|^\.github/workflows/||'); do
            git checkout "$MERGE_BASE" -- ".github/workflows/$f"
            echo "KEEP (fork-owned): .github/workflows/$f" >> "$GITHUB_STEP_SUMMARY"
          done
          # 上游新增的 workflow 文件不带过来：GitHub App token 没有 workflows 权限，
          # 带进 main 会被 "refusing to allow a GitHub App to create or update workflow" 拒掉。
          for f in $(git ls-tree --name-only HEAD .github/workflows/ | sed 's|^\.github/workflows/||'); do
            if ! git cat-file -e "$MERGE_BASE:.github/workflows/$f" 2>/dev/null; then
              git rm -q --cached ".github/workflows/$f"
              rm -f ".github/workflows/$f"
              echo "DROP (upstream-only workflow): $f" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          git add -A .github/workflows
          git commit --no-edit -m "sync: keep fork-owned workflows" || true

      - name: Report whitelist drift
        if: steps.check.outputs.has_updates == 'true'
        run: |
          set -euo pipefail
          if [ ! -s /tmp/whitelist-drift.txt ]; then
            echo "白名单文件没有漂移，上游这批改动全部合了进来"
            exit 0
          fi
          {
            echo "### 白名单漂移：以下文件的上游改动已被 ours 覆盖"
            echo ""
            echo "| 文件 | 上游这批提交改了多少行 |"
            echo "|---|---|"
            while IFS='|' read -r f stat; do
              echo "| \`$f\` | $stat |"
            done < /tmp/whitelist-drift.txt
            echo ""
            echo "冲突解决取 ours 时上面这些行会被整段丢掉。构建前跑一遍本地 diff 检查，"
            echo "确认丢的不是关键修复；必要时手工把上游改动补进来。"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS='|' read -r f stat; do
            echo "::warning::$f 的上游改动（$stat）被白名单覆盖，需人工确认"
          done < /tmp/whitelist-drift.txt

      # droiddeck-session 已摘出白名单，改由 git 正常合并；我们在里面只留两行调用。
      # 上游动了那段附近代码时可能把这两行冲掉，这里检查一下，冲掉了就报警。
      - name: Check zh patches survived
        if: steps.check.outputs.has_updates == 'true'
        run: |
          set -euo pipefail
          f=tools/linuxfs/overlay/usr/local/bin/droiddeck-session
          if grep -q "droiddeck-zh-steam-preset" "$f"; then
            echo "droiddeck-session 里的中文预设调用还在"
          else
            echo "::warning::$f 里 droiddeck-zh-steam-preset 调用被上游改动冲掉了，需要手工补回"
            echo "| $f | 中文预设调用丢失，需补回 |" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Pick up upstream's new string keys
        if: steps.check.outputs.has_updates == 'true'
        run: |
          set -euo pipefail
          # values/strings.xml 在白名单里，上游新增的 key 会被整块挡掉，代码一引用就
          # Unresolved reference。这里把缺的 key 按上游原文补进来，先保住构建。
          python3 tools/i18n/pick-up-new-strings.py --ref upstream/main
          git add app/src/main/res/values/strings.xml
          if ! git diff --cached --quiet; then
            git commit -q -m "sync: pick up new strings from upstream"
          fi

      - name: Merge directly to main (no PR needed)
        if: steps.check.outputs.has_updates == 'true'
        run: |
          set -euo pipefail
          BRANCH="${{ steps.check.outputs.branch }}"
          # Already on the sync branch with conflicts resolved.
          # Switch to main and merge the sync branch.
          git checkout main
          git merge "$BRANCH" --no-edit
          # 同上面一样：base 里存在的 workflow 全部恢复成我们的版本
          for f in $(git ls-tree --name-only "$MERGE_BASE" .github/workflows/ | sed 's|^\.github/workflows/||'); do
            git checkout "$MERGE_BASE" -- ".github/workflows/$f"
          done
          # 上游新增的 workflow 文件不带过来：GitHub App token 没有 workflows 权限，
          # 带进 main 会被 "refusing to allow a GitHub App to create or update workflow" 拒掉。
          for f in $(git ls-tree --name-only HEAD .github/workflows/ | sed 's|^\.github/workflows/||'); do
            if ! git cat-file -e "$MERGE_BASE:.github/workflows/$f" 2>/dev/null; then
              git rm -q --cached ".github/workflows/$f"
              rm -f ".github/workflows/$f"
              echo "DROP (upstream-only workflow): $f" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          git add -A .github/workflows
          git commit --no-edit -m "sync: keep fork-owned workflows" || true
          # Push directly to main
          git push origin main
          # Delete the sync branch
          git push origin --delete "$BRANCH" || true
          echo "Merged upstream and pushed to main."

      - name: Check if upstream has new stable release
        id: check_release
        if: steps.check.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Get upstream latest release tag
          UPSTREAM_TAG=$(gh api repos/Droid-Deck/DroidDeck/releases/latest --jq .tag_name 2>/dev/null || echo "")
          # Get our current version from build.gradle
          OUR_VERSION=$(sed -n 's/^ *versionName "\(.*\)"$/\1/p' app/build.gradle)
          echo "upstream_tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          echo "our_version=$OUR_VERSION" >> "$GITHUB_OUTPUT"
          echo "Upstream latest release: $UPSTREAM_TAG"
          echo "Our current version: $OUR_VERSION"
          # If upstream tag starts with our version prefix, no new release
          if [[ "$OUR_VERSION" == "$UPSTREAM_TAG"* ]]; then
            echo "has_new_release=false" >> "$GITHUB_OUTPUT"
            echo "No new upstream release, skipping release."
          else
            echo "has_new_release=true" >> "$GITHUB_OUTPUT"
            echo "New upstream release detected, will trigger release."
          fi

      - name: Update versionName to match upstream release
        if: steps.check.outputs.has_updates == 'true' && steps.check_release.outputs.has_new_release == 'true'
        run: |
          set -euo pipefail
          UPSTREAM_TAG="${{ steps.check_release.outputs.upstream_tag }}"
          NEW_VERSION="${UPSTREAM_TAG}-zh1"
          # Update versionName
          sed -i "s/versionName \".*\"/versionName \"$NEW_VERSION\"/" app/build.gradle
          # Increment versionCode
          CURRENT_CODE=$(sed -n 's/^ *versionCode \([0-9]*\)$/\1/p' app/build.gradle)
          NEW_CODE=$((CURRENT_CODE + 1))
          sed -i "s/versionCode $CURRENT_CODE/versionCode $NEW_CODE/" app/build.gradle
          git add app/build.gradle
          git commit -m "sync: bump version to $NEW_VERSION" || echo "::warning::no version bump needed"
          git push origin main || echo "::warning::version bump push failed"
          echo "Updated versionName to $NEW_VERSION, versionCode to $NEW_CODE"

      - name: Auto-release after merge (only for new upstream stable)
        if: steps.check.outputs.has_updates == 'true' && steps.check_release.outputs.has_new_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 10
          UPSTREAM_TAG="${{ steps.check_release.outputs.upstream_tag }}"
          # 只写摘要，不在这里发版：release-stable 现在只认当前提交的构建，
          # 而这次 bump 的构建还没跑完，直接发会拿错包。构建绿了手动 dispatch。
          echo " | 上游发了 `${UPSTREAM_TAG}`，版本号已改好，构建绿后手动 dispatch release-stable |" >> "$GITHUB_STEP_SUMMARY"
          echo "Version prepared for ${UPSTREAM_TAG}-zh1; release after the build is green."

      - name: Build the merged tree
        if: steps.check.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 这次 push 用的是 GITHUB_TOKEN，GitHub 不会因此触发 build.yml，
          # 合并结果就一直没人验证。workflow_dispatch 不受这条限制，显式补一次。
          gh workflow run build.yml --ref main
          echo " | 已触发构建，结果见 Actions → Build APK |" >> "$GITHUB_STEP_SUMMARY"
          echo "Triggered build.yml on main"
