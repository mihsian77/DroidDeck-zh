name: Sync upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  # Note: GitHub Actions `permissions` has no `workflows` key; `contents: write` is enough to
  # push a sync branch even when it carries .github/workflows edits. (A bogus workflows:write
  # here previously made the workflow unparseable and every push fail.)

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Droid-Deck/DroidDeck.git 2>/dev/null || true
          # Do not fetch tags: our own release tags (e.g. ci-debian-bullseye-r1) collide with
          # upstream's and would abort the whole fetch. We only need the main branch.
          git fetch upstream main

      - name: Check for new upstream commits
        id: check
        run: |
          set -euo pipefail
          BASE=$(git merge-base HEAD upstream/main)
          BEHIND=$(git rev-list --count "${BASE}..upstream/main")
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          if [ "$BEHIND" -eq 0 ]; then
            echo "No new upstream commits. Exiting."
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream is $BEHIND commits ahead."
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            UPSTREAM_SHA=$(git rev-parse --short upstream/main)
            echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
            DATE=$(date +%Y%m%d)
            echo "branch=auto-sync/upstream-${DATE}-${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"
            git log --oneline "${BASE}..upstream/main" > /tmp/upstream-commits.txt
            echo "commit_count=$BEHIND" >> "$GITHUB_OUTPUT"
          fi

      - name: Create sync branch and merge
        if: steps.check.outputs.has_updates == 'true'
        id: merge
        run: |
          set -euo pipefail
          BRANCH="${{ steps.check.outputs.branch }}"
          git checkout -b "$BRANCH"
          if git merge upstream/main --no-edit; then
            echo "merge_status=clean" >> "$GITHUB_OUTPUT"
          else
            echo "merge_status=conflict" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U > /tmp/conflict-files.txt || true
            # Keep the conflict markers in the branch so the PR shows exactly
            # what needs resolving - not a silent empty branch.
            git add -A
            git -c core.editor=true commit --no-edit -m "sync: upstream merge conflict - resolve before merging" || \
              git commit --allow-empty -m "sync: upstream merge conflict - resolve before merging"
          fi
          # Keep our own .github/workflows/ as-is. GITHUB_TOKEN cannot create or update
          # workflow files without the workflows permission, and we maintain our workflows
          # separately from upstream anyway.
          git checkout HEAD~1 -- .github/workflows/
          if [ -n "$(git status --porcelain .github/workflows/)" ]; then
            git add .github/workflows/
            git commit --no-edit -m "sync: keep our own workflows" || true
          fi

      - name: Push branch
        if: steps.check.outputs.has_updates == 'true'
        run: |
          set -euo pipefail
          git push origin "${{ steps.check.outputs.branch }}"

      - name: Wait for CI to start
        if: steps.check.outputs.has_updates == 'true'
        run: sleep 20

      - name: Create pull request
        if: steps.check.outputs.has_updates == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="${{ steps.check.outputs.branch }}"
          MERGE_STATUS="${{ steps.merge.outputs.merge_status }}"
          COMMIT_COUNT="${{ steps.check.outputs.commit_count }}"

          if [ "$MERGE_STATUS" = "conflict" ]; then
            TITLE="sync: upstream ${COMMIT_COUNT} commits need conflict resolution"
            { echo "## Upstream commits"; echo; echo '```'; cat /tmp/upstream-commits.txt; echo '```'; echo; echo "## Conflicted files"; echo; echo '```'; cat /tmp/conflict-files.txt; echo '```'; echo; echo "This branch carries the conflicted merge on purpose - resolve the markers, then merge."; } > /tmp/pr-body.txt
          else
            TITLE="sync: merge upstream ${COMMIT_COUNT} commits"
            { echo "## Upstream commits"; echo; echo '```'; cat /tmp/upstream-commits.txt; echo '```'; echo; echo "Auto-generated by sync-upstream. CI runs on this branch; auto-merge is on when checks pass."; } > /tmp/pr-body.txt
          fi

          PR_URL=$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file /tmp/pr-body.txt --label "sync" 2>&1) || PR_FAILED=1
          if [ -n "${PR_FAILED:-}" ]; then
            # PR could not be created (e.g. a PR for this branch already exists).
            # Existing PR: nothing more to do. Otherwise flag it loudly.
            if gh pr list --head "$BRANCH" --json number -q '.[0].number' | grep -q '[0-9]'; then
              echo "PR for $BRANCH already exists."
            else
              echo "::error::gh pr create failed: $PR_URL"
              gh issue create \
                --title "sync: failed to open PR for $BRANCH" \
                --body "The sync-upstream workflow could not open a pull request for branch $BRANCH.

                Upstream commits behind: $COMMIT_COUNT. Merge status: $MERGE_STATUS.

                Error:
                $PR_URL
                " || echo "::error::issue creation also failed - the sync is stuck silently"
              exit 1
            fi
          else
            echo "Created PR: $PR_URL"
            if [ "$MERGE_STATUS" = "clean" ]; then
              gh pr merge "$PR_URL" --auto --merge --delete-branch || echo "::warning::auto-merge not available (repo setting may be off)"
            fi
          fi
