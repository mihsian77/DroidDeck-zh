name: Sync upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Droid-Deck/DroidDeck.git 2>/dev/null || true
          git fetch upstream main --tags

      - name: Check for new upstream commits
        id: check
        run: |
          set -euo pipefail
          BASE=$(git merge-base HEAD upstream/main)
          BEHIND=$(git rev-list --count "${BASE}..upstream/main")
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          if [ "$BEHIND" -eq 0 ]; then
            echo "No new upstream commits. Exiting."
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream is $BEHIND commits ahead."
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            UPSTREAM_SHA=$(git rev-parse --short upstream/main)
            echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
            DATE=$(date +%Y%m%d)
            echo "branch=auto-sync/upstream-${DATE}-${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"
            # Build PR body from upstream commit messages
            git log --oneline "${BASE}..upstream/main" > /tmp/upstream-commits.txt
            echo "commit_count=$BEHIND" >> "$GITHUB_OUTPUT"
          fi

      - name: Create sync branch and merge
        if: steps.check.outputs.has_updates == 'true'
        id: merge
        run: |
          set -euo pipefail
          BRANCH="${{ steps.check.outputs.branch }}"
          git checkout -b "$BRANCH"
          if git merge upstream/main --no-edit; then
            echo "merge_status=clean" >> "$GITHUB_OUTPUT"
          else
            echo "merge_status=conflict" >> "$GITHUB_OUTPUT"
            # List conflicted files
            git diff --name-only --diff-filter=U > /tmp/conflict-files.txt || true
            git merge --abort
          fi

      - name: Push branch (clean merge)
        if: steps.merge.outputs.merge_status == 'clean'
        run: |
          git push origin "${{ steps.check.outputs.branch }}"

      - name: Push branch (conflict - empty branch for manual resolution)
        if: steps.merge.outputs.merge_status == 'conflict'
        run: |
          # Push a clean branch from main so the PR exists; user resolves locally
          git push origin "${{ steps.check.outputs.branch }}"

      - name: Wait for CI to start
        if: steps.check.outputs.has_updates == 'true'
        run: sleep 20

      - name: Create pull request
        if: steps.check.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="${{ steps.check.outputs.branch }}"
          MERGE_STATUS="${{ steps.merge.outputs.merge_status }}"
          COMMIT_COUNT="${{ steps.check.outputs.commit_count }}"

          if [ "$MERGE_STATUS" = "conflict" ]; then
            TITLE="sync: upstream has ${COMMIT_COUNT} new commits (merge conflict - needs manual resolution)"
            BODY="## Upstream commits\n\n\`\`\`\n$(cat /tmp/upstream-commits.txt)\n\`\`\`\n\n## Conflicted files\n\n\`\`\`\n$(cat /tmp/conflict-files.txt)\n\`\`\`\n\nMerge conflicts detected. Resolve locally:\n\`\`\`bash\ngit fetch origin\ngit checkout $BRANCH\ngit merge upstream/main\n# resolve conflicts, then:\ngit add -A\ngit commit\ngit push origin $BRANCH\n\`\`\`"
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY" --label "sync,needs-review" || true
          else
            TITLE="sync: merge upstream ${COMMIT_COUNT} commits"
            BODY="## Upstream commits\n\n\`\`\`\n$(cat /tmp/upstream-commits.txt)\n\`\`\`\n\nAuto-generated by sync-upstream workflow. CI build runs on this branch; review and merge if green."
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY" --label "sync,auto-merge" || true
          fi
