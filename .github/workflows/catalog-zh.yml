name: Update catalog

# 我们自己的应用内更新 catalog。上游那套要 GitHub App token 往 DroidDeck-CI 里推，我们用不上。
# 这里只读本仓库的 release，生成 catalog.json 提交到 main，App 拉 raw 地址。

on:
  workflow_call:
  release:
    types: [published, edited, deleted, released, unpublished]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 和 sync-upstream、publish-packs 共用 main-write 组，避免同时往 main 提交。
# 这里不能开 cancel-in-progress：共用组时取消会把正在跑的同步一起杀掉。
# catalog 本身是幂等的（整份重生成），排队晚跑一次没影响。
concurrency:
  group: main-write
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Build catalog.json
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 tools/release/make-catalog.py catalog.json

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- catalog.json)" ]; then
            echo "catalog 没变化"
            exit 0
          fi
          git add catalog.json
          git commit -m "chore: 更新应用内更新用的 catalog"
          git push
