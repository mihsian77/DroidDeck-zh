name: Publish add-on packs

# 把构建产出的附加包（tools/packs/build.sh 打的那几个）发到本仓库的一个 `packs` release，
# 资产名带 sha：<name>-<sha256 前 16 位>.tar.zst。APK 里钉的就是这个 sha，按资产名取。
# 以前是一个包一个 release（tag = pack-<name>-<sha16>），九个包九个条目，列表一半是它；
# 现在收成一个 release，App 端先走这条路径，老路径留着兼容。
# 上游那套要求往 Droid-Deck/DroidDeck-Components 发包，需要对方的 GitHub App token，
# 这里改成发到我们自己的仓库。

on:
  workflow_call:
    inputs:
      run_id:
        description: The Build APK run whose packs to publish; empty for the calling run's own
        type: string
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: publish add-on packs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: publish-packs
      cancel-in-progress: false
    steps:
      - name: Check out the repo (only to keep the proot pin current)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: src

      - name: The packs (this run's build)
        if: inputs.run_id == ''
        uses: actions/download-artifact@v4
        with:
          name: droiddeck-packs
          path: packs

      - name: The packs (another Build APK run)
        if: inputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.run_id }}
        run: gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n droiddeck-packs -D packs

      - name: Publish into the packs release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BUILD_RUN: ${{ inputs.run_id || github.run_id }}
        run: |
          set -euo pipefail
          tag=packs
          notes="DroidDeck-zh add-on packs. 资产名是 \`<name>-<sha256 前 16 位>.tar.zst\`，APK 里钉的就是这个 sha。同名只会留最新的一份，旧的删掉。"
          if ! gh release view "$tag" -R "$REPO" >/dev/null 2>&1; then
            gh release create "$tag" -R "$REPO" --title "add-on packs" \
              --notes "$notes" --latest=false
          fi
          rel_id=$(gh api "repos/$REPO/releases/tags/$tag" --jq .id)
          for name in proot directaudio tracking xbox comet butler powervr ubisoft; do
            file="packs/$name.tar.zst"
            [ -f "$file" ] || { echo "::error::$name.tar.zst is missing from Build APK run $BUILD_RUN"; exit 1; }
            sha=$(sha256sum "$file" | cut -d' ' -f1)
            size=$(stat -c %s "$file")
            asset="$name-${sha:0:16}.tar.zst"
            have=$(gh api "repos/$REPO/releases/tags/$tag" \
              --jq ".assets[] | select(.name == \"$asset\") | .size")
            if [ "$have" = "$size" ]; then
              echo "$asset 已经在 packs release 里（$size 字节），跳过"
              echo "- \`$name\`: \`$asset\` \`${sha:0:16}\`" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            [ -n "$have" ] && gh release delete-asset "$tag" "$asset" -R "$REPO" --yes
            # gh release upload 只按 basename 命名资产，改不了名；这里直接走上传接口。
            gh api --method POST \
              "https://uploads.github.com/repos/$REPO/releases/$rel_id/assets?name=$asset" \
              -H "Content-Type: application/octet-stream" --input "$file" >/dev/null
            got_size=$(gh api "repos/$REPO/releases/tags/$tag" \
              --jq ".assets[] | select(.name == \"$asset\") | .size")
            if [ "$got_size" != "$size" ]; then
              echo "::error::$asset 传上去是 ${got_size:-nothing}，不是 $size 字节"
              exit 1
            fi
            got=$(gh api "repos/$REPO/releases/tags/$tag" \
              --jq ".assets[] | select(.name == \"$asset\") | .digest")
            case "$got" in
              "sha256:$sha") : ;;
              ""|null) echo "::warning::$asset 的 digest 还没算出来，先按尺寸认了" ;;
              *) echo "::error::$asset 的 digest 是 $got，不是 sha256:$sha"; exit 1 ;;
            esac
            echo "- \`$name\`: \`$asset\` \`${sha:0:16}\`" >> "$GITHUB_STEP_SUMMARY"
          done

      # 同名只留最新一份：ubisoft 的 exe 每次重新编译都带时间戳，sha 每次都不同，
      # 不清就会在 packs release 里无限堆积（以前是一个个 release 堆）。
      - name: Prune superseded pack assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=packs
          for name in proot directaudio tracking xbox comet butler powervr ubisoft; do
            newest=$(sha256sum "packs/$name.tar.zst" | cut -d' ' -f1 | cut -c1-16)
            mapfile -t stale < <(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
              --jq ".assets[] | select(.name | startswith(\"$name-\")) | .name" |
              grep -v "^${name}-${newest}\.tar\.zst$" || true)
            for asset in "${stale[@]}"; do
              [ -n "$asset" ] || continue
              echo "prune $asset"
              gh release delete-asset "$tag" "$asset" -R "$GITHUB_REPOSITORY" --yes || \
                echo "::warning::could not delete $asset"
            done
          done

      # 上游改 proot 构建时产物 sha 会变，App 里钉的 pin 跟不上就一直发新包并在构建里告警。
      # 这里直接把实测 sha 写回 release.env，省得每次人工去追。
      - name: Keep the proot pin current
        working-directory: src
        run: |
          set -euo pipefail
          sha=$(sha256sum ../packs/proot.tar.zst | cut -d' ' -f1)
          size=$(stat -c %s ../packs/proot.tar.zst)
          env_file=tools/packs/proot/release.env
          current=$(sed -n 's/^PROOT_PACK_SHA256=//p' "$env_file")
          if [ "$current" = "$sha" ]; then
            echo "pin already matches ${sha:0:16}"
            exit 0
          fi
          sed -i "s|^PROOT_PACK_SHA256=.*|PROOT_PACK_SHA256=$sha|" "$env_file"
          sed -i "s|^PROOT_PACK_SIZE=.*|PROOT_PACK_SIZE=$size|" "$env_file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$env_file"
          git commit -q -m "chore: 跟上上游 proot 构建（${sha:0:16}，$size 字节）"
          for i in 1 2 3; do
            git pull --rebase --autostash -q && git push -q && break || sleep 5
          done
          echo "pin was ${current:0:16}, now ${sha:0:16}"
