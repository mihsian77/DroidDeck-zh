name: Update app catalog

# 上游这个 workflow 要用 GitHub App token 往 DroidDeck-CI 推 catalog，我们用不上，
# 换成自己的 catalog-zh.yml。这里只留手动入口，避免 release 事件刷出失败记录。
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: update-app-catalog
  cancel-in-progress: false

jobs:
  catalog:
    if: false  # disabled: requires upstream GitHub App token we don't have
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/create-github-app-token@v2
        id: ci-token
        with:
          app-id: ${{ vars.DROIDDECK_CI_APP_ID }}
          private-key: ${{ secrets.DROIDDECK_CI_APP_KEY }}
          owner: Droid-Deck
          repositories: DroidDeck-CI

      - name: Regenerate catalog.json
        env:
          SOURCE_GITHUB_TOKEN: ${{ github.token }}
          CI_GITHUB_TOKEN: ${{ steps.ci-token.outputs.token }}
        run: |
          set -euo pipefail
          python3 tools/release/update_catalog.py
