name: Release Stable APK
run-name: release stable ${{ inputs.label }} from ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      label:
        description: Optional release label, e.g. 0.3.1-zh1. Defaults to versionName from app/build.gradle.
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-stable
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Stable releases are built from the newest green main build: download its signed APK
      # (signed with the public testkey inside build.yml, same key as the original app).
      - name: Find newest successful main build
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --workflow build.yml --branch main --status success \
            --json databaseId --jq '.[0].databaseId' -L 20)
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::no successful main build found to promote"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Promoting build $run_id"

      - name: Download APK
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ steps.find.outputs.run_id }}
        run: gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n droiddeck-apk -D apk

      - name: Verify APK exists
        run: |
          set -euo pipefail
          ls -la apk/*.apk || { echo "::error::no APK found"; exit 1; }
          echo "APK found:"
          ls apk/*.apk

      - name: Publish stable release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ *versionName "\(.*\)"$/\1/p' app/build.gradle)
          tag=${version:-${{ inputs.label }}}
          [ -n "$tag" ] || { echo "::error::no versionName and no label given"; exit 1; }
          sha7=${GITHUB_SHA::7}
          subject=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.commit.message | split("\n")[0]')
          cd apk
          sha256sum *.apk > SHA256SUMS.txt
          cd ..
          notes="## ${tag} (stable)

          ${subject}

          基于上游 DroidDeck 源码编译的中文优化版，已确认稳定可用。

          ### 独家功能
          - 全量中文精翻（Linux/Wine/Steam 术语）
          - 竖屏适配（管理界面跟随系统旋转，游戏会话保持横屏）
          - 中文字体注入（文泉驿微米黑兜底，Steam 中文不乱码）
          - 退出 Steam 登录按钮（主页设置旁，只清凭证保留设置）
          - MirrorHub 智能加速（Linux 运行时/Proton 下载自动选最快节点）
          - 数据包本地导入（离线安装 Linux 运行时/桌面/Proton）

          ### 注意
          - 签名使用 DroidDeck-zh 自有 release key（非上游 testkey），覆盖安装时可能提示未知来源，属正常现象
          - 此为稳定版，安装前建议先备份旧版本

          SHA-256:
          \`\`\`
          $(cat apk/SHA256SUMS.txt)
          \`\`\`"
          # Remove an older stable with the same tag if any, then publish as non-prerelease.
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" --target main --title "$tag (stable)" --notes "$notes" apk/*
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag"
          echo "release=$url" >> "$GITHUB_OUTPUT"
          echo "Published $url"

      - name: Update catalog.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Reuse the shared generator (single source of truth).
          signer=$(cat keystore/release-signer.sha256 | tr 'A-F' 'a-f')
          version=$(sed -n 's/^ *versionName "\(.*\)"$/\1/p' app/build.gradle)
          tag=${version:-${{ inputs.label }}}
          AAPT=$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -n1)/aapt
          # Real values of the promoted APK, taken from the file in hand.
          versionCode=$("$AAPT" dump badging apk/*.apk | sed -n "s/^package: name=.* versionCode='\([0-9]*\)'.*$/\1/p")
          sha256=$(awk '{print $1}' apk/SHA256SUMS.txt | tr 'A-F' 'a-f')
          commit=$(gh run view "${{ steps.find.outputs.run_id }}" --json headSha --jq .headSha)
          sleep 5
          # promote: write the promoted APK's real values into the stable row;
          # the preview row is inherited unchanged from the previous catalog.
          python3 .github/scripts/catalog.py promote \
            --repo "$GITHUB_REPOSITORY" --tag "$tag" \
            --version "$version" --version-code "$versionCode" \
            --signer "$signer" --commit "$commit" --sha256 "$sha256"
          cd /tmp/catalog
          git init -q
          git config user.email "mihsian77@users.noreply.github.com"
          git config user.name "mihsian77"
          git add catalog.json
          git commit -q -m "catalog: promote ${tag} to stable"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:catalog
          echo "catalog.json pushed to catalog branch"
