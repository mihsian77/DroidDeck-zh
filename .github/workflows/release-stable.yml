name: Release Stable APK
run-name: release stable ${{ inputs.label }} from ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      label:
        description: Optional release label, e.g. 0.3.1-zh1. Defaults to versionName from app/build.gradle.
        required: false
        type: string
      summary:
        description: Optional first line of the release notes. Defaults to the commit subject, which is wrong when the release is dispatched from a CI commit.
        required: false
        type: string

permissions:
  contents: write
  actions: write
  pull-requests: read

concurrency:
  group: release-stable
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Stable releases are built from the newest green main build: download its signed APK
      # (signed with the public testkey inside build.yml, same key as the original app).
      - name: Find newest successful main build
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 不能直接取「最新的成功构建」：同步刚 bump 完版本号就发版会拿到上一个
          # 提交的 APK，tag 是新的、包是旧的。这里取最新构建，再要求它的源码树
          # 和当前提交一致（app/tools/keystore 就是打进 APK 的东西）。catalog.json
          # 这类自动提交、以及工作流本身的改动不影响已有产物，允许跳过。
          run_id=$(gh run list --workflow build.yml --branch main --status success \
            --json databaseId --jq '.[0].databaseId' -L 20)
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::找不到可用的构建"
            exit 1
          fi
          build_sha=$(gh run view "$run_id" --json headSha --jq .headSha)
          git fetch -q origin "$build_sha" || true
          if ! git diff --quiet "$build_sha" "$GITHUB_SHA" -- app tools keystore; then
            echo "::error::构建 $build_sha 之后源码还有改动，这个包不是当前代码，等新构建绿了再发"
            git diff --stat "$build_sha" "$GITHUB_SHA" -- app tools keystore
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Promoting build $run_id (head $build_sha, source tree matches $GITHUB_SHA)"

      - name: Download APK
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ steps.find.outputs.run_id }}
        run: gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n droiddeck-signed-standard -D apk

      - name: Verify APK exists
        run: |
          set -euo pipefail
          ls -la apk/*.apk || { echo "::error::no APK found"; exit 1; }
          echo "APK found:"
          ls apk/*.apk

      - name: Publish stable release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ *versionName "\(.*\)"$/\1/p' app/build.gradle)
          tag=${version:-${{ inputs.label }}}
          [ -n "$tag" ] || { echo "::error::no versionName and no label given"; exit 1; }
          sha7=${GITHUB_SHA::7}
          # 发版常常是从一个 CI 提交 dispatch 的，直接拿提交标题会出现
          # "ci(release): ..." 这种和版本无关的首行，所以允许显式传 summary。
          subject="${{ inputs.summary }}"
          if [ -z "$subject" ]; then
            subject=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.commit.message | split("\n")[0]')
          fi
          # sha256 只给 catalog 用，不再往 release 上挂文件：GitHub 每个资产自带
          # digest，catalog.json 里也有一份，再传两个 txt 是第三份重复数据。
          cd apk
          sha256sum *.apk > SHA256SUMS.txt
          cd ..
          notes="## ${tag} (stable)

          ${subject}

          基于上游 DroidDeck 源码编译的中文优化版，CI 全流程通过。

          ### 独家功能
          - 全量中文精翻（Linux/Wine/Steam 术语）
          - 竖屏适配（管理界面跟随系统旋转，游戏会话保持横屏）
          - 中文字体注入（文泉驿微米黑兜底，Steam 中文不乱码）
          - 退出 Steam 登录按钮（主页设置旁，只清凭证保留设置）
          - MirrorHub 智能加速（Linux 运行时/Proton 下载自动选最快节点）
          - 数据包本地导入（离线安装 Linux 运行时/桌面/Proton）

          ### 注意
          - 签名使用 DroidDeck-zh 自有 release key（非上游 testkey），覆盖安装时可能提示未知来源，属正常现象
          - GPU 兼容层与 add-on pack 未逐机型真机验证，详见 README「中文优化版」一节
          - 此为稳定版，安装前建议先备份旧版本"
          # Remove an older stable with the same tag if any, then publish as non-prerelease.
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" --target main --title "$tag (stable)" --notes "$notes" apk/*.apk
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag"
          echo "release=$url" >> "$GITHUB_OUTPUT"
          echo "Published $url"

      - name: Refresh the update catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The app reads catalog.json from main. A release published with GITHUB_TOKEN does
          # not fire `release: published`, so the catalog job has to be kicked by hand.
          # make-catalog.py rebuilds the file from the releases API; nothing to promote here.
          sleep 5
          gh workflow run catalog-zh.yml --ref main
          echo "catalog-zh dispatched"

      - name: Attach data packages to this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(sed -n 's/^ *versionName "\(.*\)"$/\1/p' app/build.gradle)
          [ -n "$tag" ] || { echo "::error::no versionName"; exit 1; }
          # 数据包跟 APK 放同一个 release。不在这里补的话得等第二天 6 点的定时任务，
          # 中间这段时间新正式版是光秃秃的，列表看着不一致。
          gh workflow run sync-data-packages.yml --ref main -f target_tag="$tag"
          echo " | 已在后台把数据包挂到 $tag |" >> "$GITHUB_STEP_SUMMARY"
