name: Sync data packages

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '上游版本没变化也重新上传'
        type: boolean
        default: false
      target_tag:
        description: '上传到哪个 release，留空自动选最新正式版'
        type: string
        default: ''
      drop_legacy:
        description: '迁移后删除旧的 data-packages release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-data-packages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Fetch upstream catalogs
        id: upstream
        run: |
          set -euo pipefail
          curl -sL "https://raw.githubusercontent.com/The412Banner/winlator-contents/main/linuxfs.json" -o /tmp/linuxfs.json
          curl -sL "https://raw.githubusercontent.com/The412Banner/winlator-contents/main/desktop.json" -o /tmp/desktop.json
          curl -sL "https://raw.githubusercontent.com/The412Banner/winlator-contents/main/steam-seed.json" -o /tmp/steam-seed.json
          LF_VERSION=$(python3 -c "import json; print(json.load(open('/tmp/linuxfs.json'))['version'])")
          LF_URL=$(python3 -c "import json; print(json.load(open('/tmp/linuxfs.json'))['url'])")
          LF_SHA256=$(python3 -c "import json; print(json.load(open('/tmp/linuxfs.json'))['sha256'])")
          LF_SIZE=$(python3 -c "import json; print(json.load(open('/tmp/linuxfs.json'))['size'])")
          echo "linuxfs_version=$LF_VERSION" >> "$GITHUB_OUTPUT"
          echo "linuxfs_url=$LF_URL" >> "$GITHUB_OUTPUT"
          echo "linuxfs_sha256=$LF_SHA256" >> "$GITHUB_OUTPUT"
          echo "linuxfs_size=$LF_SIZE" >> "$GITHUB_OUTPUT"
          # The desktop entry: tier-1 tar over the rootfs (LXQt on labwc). Nothing else joins
          # the bundle: emulators and appimages stay per-package, Steam/Proton are Valve's own.
          DT_VERSION=$(python3 -c "import json; d=json.load(open('/tmp/desktop.json')); p=next(x for x in d['packages'] if x['id']=='desktop'); print(p.get('version',''))")
          DT_URL=$(python3 -c "import json; d=json.load(open('/tmp/desktop.json')); p=next(x for x in d['packages'] if x['id']=='desktop'); print(p['url'])")
          DT_SHA256=$(python3 -c "import json; d=json.load(open('/tmp/desktop.json')); p=next(x for x in d['packages'] if x['id']=='desktop'); print(p.get('sha256',''))")
          DT_SIZE=$(python3 -c "import json; d=json.load(open('/tmp/desktop.json')); p=next(x for x in d['packages'] if x['id']=='desktop'); print(p.get('size',0))")
          echo "desktop_version=$DT_VERSION" >> "$GITHUB_OUTPUT"
          echo "desktop_url=$DT_URL" >> "$GITHUB_OUTPUT"
          echo "desktop_sha256=$DT_SHA256" >> "$GITHUB_OUTPUT"
          echo "desktop_size=$DT_SIZE" >> "$GITHUB_OUTPUT"
          # The Proton seed: Valve's Experimental ARM64 build, mirrored by winlator-contents.
          # It is a standalone asset (not part of the bundle zip) - Proton is a Steam-account
          # component and users import it from the Proton page when the download is slow.
          PR_VERSION=$(python3 -c "import json; d=json.load(open('/tmp/steam-seed.json')); p=next(x for x in d['packages'] if x['id']=='proton-arm64'); print(p.get('version',''))")
          PR_URL=$(python3 -c "import json; d=json.load(open('/tmp/steam-seed.json')); p=next(x for x in d['packages'] if x['id']=='proton-arm64'); print(p['url'])")
          PR_SHA256=$(python3 -c "import json; d=json.load(open('/tmp/steam-seed.json')); p=next(x for x in d['packages'] if x['id']=='proton-arm64'); print(p.get('sha256',''))")
          PR_SIZE=$(python3 -c "import json; d=json.load(open('/tmp/steam-seed.json')); p=next(x for x in d['packages'] if x['id']=='proton-arm64'); print(p.get('size',0))")
          echo "proton_version=$PR_VERSION" >> "$GITHUB_OUTPUT"
          echo "proton_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "proton_sha256=$PR_SHA256" >> "$GITHUB_OUTPUT"
          echo "proton_size=$PR_SIZE" >> "$GITHUB_OUTPUT"
          echo "Upstream linuxfs $LF_VERSION, desktop $DT_VERSION, proton $PR_VERSION"

      # 数据包不再单独发一个 release：都挂在最新正式版下面，正式版在 release 页上排第一。
      - name: Resolve target release
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ inputs.target_tag }}'
          if [ -z "$tag" ]; then
            tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-pre-releases --limit 50 \
              --json tagName,isLatest,createdAt |
              jq -r '([.[] | select(.isLatest and .tagName != "data-packages")][0].tagName)
                     // ([.[] | select(.tagName != "data-packages")][0].tagName) // ""')
          fi
          if [ -z "$tag" ]; then
            echo "::error::仓库里没有正式版 release 可以挂数据包，先发一个正式版本，或者手动填 target_tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "数据包目标 release：$tag"

      - name: Check current data-packages release
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          META=$(gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p data-packages.json -O - 2>/dev/null || true)
          FORCE='${{ inputs.force }}'
          if [ -z "$META" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
            echo "current_linuxfs=none" >> "$GITHUB_OUTPUT"
            echo "current_desktop=none" >> "$GITHUB_OUTPUT"
            echo "current_proton=none" >> "$GITHUB_OUTPUT"
          else
            echo "exists=true" >> "$GITHUB_OUTPUT"
            CL=$(jq -r '.linuxfs.version // "unknown"' <<<"$META")
            CD=$(jq -r '.desktop.version // "unknown"' <<<"$META")
            CP=$(jq -r '.proton.version // "unknown"' <<<"$META")
            echo "current_linuxfs=$CL" >> "$GITHUB_OUTPUT"
            echo "current_desktop=$CD" >> "$GITHUB_OUTPUT"
            echo "current_proton=$CP" >> "$GITHUB_OUTPUT"
            if [ "$FORCE" != "true" ] \
               && [ "$CL" = "${{ steps.upstream.outputs.linuxfs_version }}" ] \
               && [ "$CD" = "${{ steps.upstream.outputs.desktop_version }}" ] \
               && [ "$CP" = "${{ steps.upstream.outputs.proton_version }}" ]; then
              echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            else
              echo "up_to_date=false" >> "$GITHUB_OUTPUT"
            fi
            echo "当前数据包：linuxfs $CL, desktop $CD, proton $CP"
          fi

      - name: Skip if up to date
        if: steps.current.outputs.up_to_date == 'true'
        run: echo "Already at linuxfs ${{ steps.upstream.outputs.linuxfs_version }}. Nothing to do."

      - name: Download linuxfs archive
        if: steps.current.outputs.up_to_date != 'true'
        run: |
          set -euo pipefail
          echo "Downloading linuxfs ${{ steps.upstream.outputs.linuxfs_version }}..."
          curl -sL --retry 3 --retry-delay 5 -o /tmp/linuxfs.tar.zst "${{ steps.upstream.outputs.linuxfs_url }}"
          echo "Verifying sha256..."
          echo "${{ steps.upstream.outputs.linuxfs_sha256 }}  /tmp/linuxfs.tar.zst" | sha256sum -c -
          ls -lh /tmp/linuxfs.tar.zst

      - name: Download desktop archive
        if: steps.current.outputs.up_to_date != 'true'
        run: |
          set -euo pipefail
          echo "Downloading desktop ${{ steps.upstream.outputs.desktop_version }}..."
          curl -sL --retry 3 --retry-delay 5 -o /tmp/desktop.tar.zst "${{ steps.upstream.outputs.desktop_url }}"
          echo "Verifying sha256..."
          echo "${{ steps.upstream.outputs.desktop_sha256 }}  /tmp/desktop.tar.zst" | sha256sum -c -
          ls -lh /tmp/desktop.tar.zst

      - name: Download proton archive
        if: steps.current.outputs.up_to_date != 'true'
        run: |
          set -euo pipefail
          echo "Downloading proton ${{ steps.upstream.outputs.proton_version }}..."
          curl -sL --retry 3 --retry-delay 5 -o /tmp/proton.tar.zst "${{ steps.upstream.outputs.proton_url }}"
          echo "Verifying sha256..."
          echo "${{ steps.upstream.outputs.proton_sha256 }}  /tmp/proton.tar.zst" | sha256sum -c -
          ls -lh /tmp/proton.tar.zst

      - name: Build all-in-one bundle
        if: steps.current.outputs.up_to_date != 'true'
        run: |
          set -euo pipefail
          cat > /tmp/manifest.json <<EOF
          {
            "format": "droiddeck-bundle",
            "linuxfs": {
              "version": "${{ steps.upstream.outputs.linuxfs_version }}",
              "sha256": "${{ steps.upstream.outputs.linuxfs_sha256 }}",
              "size": ${{ steps.upstream.outputs.linuxfs_size }}
            },
            "desktop": {
              "id": "desktop",
              "version": "${{ steps.upstream.outputs.desktop_version }}",
              "name": "Desktop (LXQt on labwc)",
              "sha256": "${{ steps.upstream.outputs.desktop_sha256 }}",
              "size": ${{ steps.upstream.outputs.desktop_size }}
            }
          }
          EOF
          python3 - <<'PYEOF'
          import zipfile, os
          with zipfile.ZipFile('/tmp/droiddeck-bundle.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              z.write('/tmp/manifest.json', 'manifest.json')
              z.write('/tmp/linuxfs.tar.zst', 'linuxfs.tar.zst')
              z.write('/tmp/desktop.tar.zst', 'desktop.tar.zst')
          PYEOF
          ls -lh /tmp/droiddeck-bundle.zip

      - name: Upload data packages into the target release
        if: steps.current.outputs.up_to_date != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
          DROP_LEGACY: ${{ inputs.drop_legacy }}
        run: |
          set -euo pipefail
          cat > /tmp/data-packages.json <<EOF
          {
            "linuxfs": {
              "version": "${{ steps.upstream.outputs.linuxfs_version }}",
              "sha256": "${{ steps.upstream.outputs.linuxfs_sha256 }}",
              "size": ${{ steps.upstream.outputs.linuxfs_size }}
            },
            "desktop": {
              "version": "${{ steps.upstream.outputs.desktop_version }}",
              "sha256": "${{ steps.upstream.outputs.desktop_sha256 }}",
              "size": ${{ steps.upstream.outputs.desktop_size }}
            },
            "proton": {
              "version": "${{ steps.upstream.outputs.proton_version }}",
              "sha256": "${{ steps.upstream.outputs.proton_sha256 }}",
              "size": ${{ steps.upstream.outputs.proton_size }}
            },
            "source": "The412Banner/winlator-contents"
          }
          EOF

          for asset in droiddeck-bundle.zip linuxfs.tar.zst desktop.tar.zst proton.tar.zst data-packages.json; do
            gh release delete-asset "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          done
          gh release upload "$TAG" \
            /tmp/droiddeck-bundle.zip /tmp/linuxfs.tar.zst /tmp/desktop.tar.zst /tmp/proton.tar.zst /tmp/data-packages.json \
            --repo "$GITHUB_REPOSITORY" --clobber

          # 正式版标成 Latest，这样 release 页上它排在最前面，预发布包自然排在后面
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest

          # 说明段落只加一次，避免每次同步都改正式版的发布说明
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""')
          if ! grep -q 'data-packages-section' <<<"$body"; then
            {
              echo "$body"
              echo
              echo '<!-- data-packages-section -->'
              echo '### 离线数据包（Linux 运行时 / 桌面 / Proton）'
              echo
              echo '网络慢或者不想等 App 内下载的时候，从这里下，App 里用「导入」选文件即可。'
              echo
              echo '- `droiddeck-bundle.zip`：linuxfs + desktop 合包，导入后依次安装运行时和桌面'
              echo '- `linuxfs.tar.zst`：单独装 Linux 运行时'
              echo '- `desktop.tar.zst`：单独装 Linux 桌面'
              echo '- `proton.tar.zst`：Proton 兼容层，在 Proton 版本页导入'
              echo '- `data-packages.json`：上面几个包的版本和 sha256，给脚本用'
              echo
              echo '> 数据包来自 The412Banner/winlator-contents，只做镜像分发，每天自动跟上游同步一次。'
              echo '> Steam 客户端不在里面，那个得 Valve 自己下，没法再分发。'
            } > /tmp/body.md
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/body.md
          fi

          if [ "$DROP_LEGACY" = "true" ]; then
            gh release delete data-packages --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
            echo "旧的 data-packages release 已删除"
          fi

          echo "数据包已上传到 $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
