name: Build APK
run-name: ${{ github.event_name == 'pull_request' && format('building pr {0} on {1}', github.event.pull_request.number, github.event.pull_request.head.sha) || format('building {0} on {1}', github.ref_name, github.sha) }}

on:
  push:
    branches: [ main, 'auto-sync/**' ]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  # Replace older builds only for the same PR. Each push/dispatch gets its own group so one main
  # build cannot cancel another before it signs and publishes.
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PRELOAD_CACHE_VERSION: v3

jobs:
  build:
    name: Build APK
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      variants: ${{ steps.variants.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: The packages a signed build ships as
        id: variants
        run: echo "list=$(awk '!/^#/ && NF { print $1 }' tools/release/variants.txt | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

      - name: No private key in the tree
        run: |
          set -euo pipefail
          keys=$(git ls-files | grep -iE '\.(jks|keystore|p12|pfx|pk8|pem|key)$' | grep -vx 'keystore/testkey.p12' || true)
          if [ -n "$keys" ]; then
            echo "::error::a private key is committed - remove it from the history and make a new one: $keys"
            exit 1
          fi

      - name: Version bumps are isolated
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          base=$(git merge-base origin/main HEAD)
          diff=$(git diff -U0 "$base..HEAD" -- app/build.gradle)
          grep -Eq '^[+-][[:space:]]*version(Code|Name)[[:space:]]' <<<"$diff" || exit 0
          other_files=$(git diff --name-only "$base..HEAD" | grep -v '^app/build.gradle$' || true)
          other_gradle=$(grep -E '^[+-]' <<<"$diff" | grep -Ev '^(---|\+\+\+)' | grep -Ev '^[+-][[:space:]]*version(Code|Name)[[:space:]]' || true)
          if [[ -n "$other_files" || -n "$other_gradle" ]]; then
            echo "::error::versionCode/versionName changes must be isolated in their own PR"
            echo "A version PR may only change the versionCode/versionName lines in app/build.gradle." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Merge onto main, or say what conflicts
        if: github.event_name == 'pull_request'
        run: |
          set -uo pipefail
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git fetch --no-tags origin main
          BASE=$(git rev-parse --short origin/main)
          HEAD=$(git rev-parse --short HEAD)
          if git merge --no-ff --no-edit origin/main >/tmp/merge.out 2>&1; then
            {
              echo "###  Mergeable"
              echo
              echo "\`$HEAD\` merges cleanly onto main (\`$BASE\`). What follows was built from the merged result."
            } > /tmp/pr-merge.md
            cat /tmp/pr-merge.md >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          FILES=$(git diff --name-only --diff-filter=U)
          if [ -z "$FILES" ]; then
            {
              echo "### ERROR: Could not merge onto main (\`$BASE\`)"
              echo
              echo '```'
              cat /tmp/merge.out
              echo '```'
            } > /tmp/pr-merge.md
            cat /tmp/pr-merge.md >> "$GITHUB_STEP_SUMMARY"
            echo "::error::git could not merge main: $(head -3 /tmp/merge.out | tr '\n' ' ')"
            exit 1
          fi
          {
            echo "### ERROR: Not mergeable - conflicts with main (\`$BASE\`)"
            echo
            echo "Files that conflict:"
            echo
            for f in $FILES; do echo "- \`$f\`"; done
            echo
            echo "Each conflicting hunk, as git leaves it: \`<<<<<<< HEAD\` is this pull request, \`>>>>>>> origin/main\` is main."
            echo
            for f in $FILES; do
              echo "<details><summary><code>$f</code></summary>"
              echo
              echo '```'
              awk '/^<<<<<<< /{p=1} p{print} /^>>>>>>> /{p=0}' "$f" | head -300
              echo '```'
              echo "</details>"
              echo
            done
            echo "Not built: rebase or merge main into the branch and push again."
          } > /tmp/pr-merge.md
          cat /tmp/pr-merge.md >> "$GITHUB_STEP_SUMMARY"
          git merge --abort || true
          echo "::error::the pull request conflicts with main: $(echo $FILES | tr '\n' ' ')"
          exit 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Resolve the runner's NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}}"
          VERSION=$(sed -n 's/^Pkg.Revision *= *//p' "$NDK/source.properties")
          echo "NDK_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set the APK build label
        id: build-label
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BUILD_REF: ${{ github.ref_name }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            tree_state=dirty
          else
            tree_state=clean
          fi
          echo "DROIDDECK_BUILD_TREE_STATE=$tree_state" >> "$GITHUB_ENV"
          if [[ -n "$PR_NUMBER" ]]; then
            label="pr${PR_NUMBER} at ${PR_HEAD_SHA:0:7}"
          else
            label="${BUILD_REF} at ${BUILD_SHA:0:7}"
          fi
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "DROIDDECK_SOURCE_COMMIT=${PR_HEAD_SHA:-$BUILD_SHA}" >> "$GITHUB_ENV"
          echo "DROIDDECK_PR_NUMBER=${PR_NUMBER:-0}" >> "$GITHUB_ENV"
          echo "Build: \`$label\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Cache the preloads
        id: preloads
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/linuxfs
          key: preloads-${{ env.PRELOAD_CACHE_VERSION }}-${{ hashFiles('app/src/main/cpp/fakeinput_steam.cpp', 'tools/linuxfs/preload/*.c', 'tools/linuxfs/build-x86-preloads.sh', 'tools/linuxfs/fex/*', 'tools/linuxfs/clipboard/*.c', 'tools/linuxfs/ssbs/*.c', 'tools/proot/fastpath/*.c', 'tools/linuxfs/overlay/usr/local/bin/*', 'tools/linuxfs/overlay/usr/bin/**', 'tools/linuxfs/overlay/usr/share/fonts/**', 'tools/linuxfs/overlay/etc/fonts/**', 'tools/linuxfs/desktop/*', 'tools/gamescope/release.env', 'tools/wlroots/release.env', 'tools/linuxfs/uruntime.env', 'tools/linuxfs/licenses/*', 'tools/mangoapp/*', 'tools/msitools/**') }}

      - name: Build libfakeinput.so and libblsession.so (glibc aarch64)
        if: steps.preloads.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu g++-aarch64-linux-gnu >/dev/null
          D=app/src/main/assets/linuxfs
          mkdir -p "$D"
          aarch64-linux-gnu-g++ -shared -fPIC -O2 -Wall -Wno-attributes -Wno-nonnull-compare \
            -pthread -std=c++17 -static-libstdc++ -static-libgcc -Wl,--exclude-libs,ALL \
            -o "$D/libfakeinput.so" app/src/main/cpp/fakeinput_steam.cpp -ldl
          aarch64-linux-gnu-strip --strip-unneeded "$D/libfakeinput.so"
          aarch64-linux-gnu-gcc -shared -fPIC -O2 -Wall -pthread \
            -o "$D/libblsession.so" tools/linuxfs/preload/*.c -ldl
          aarch64-linux-gnu-strip --strip-unneeded "$D/libblsession.so"
          aarch64-linux-gnu-gcc -shared -fPIC -O2 -Wall -pthread \
            -o "$D/libblfastpath.so" tools/proot/fastpath/fastpath.c -ldl
          aarch64-linux-gnu-strip --strip-unneeded "$D/libblfastpath.so"
          # Force-SSBS adapter, preloaded into a game's Wine only when the game asks for it.
          aarch64-linux-gnu-gcc -shared -fPIC -O2 -Wall -pthread \
            -o "$D/libssbs.so" tools/linuxfs/ssbs/ssbs_adapter.c -ldl
          aarch64-linux-gnu-strip --strip-unneeded "$D/libssbs.so"
          mkdir -p "$D/usr/local/bin"
          aarch64-linux-gnu-gcc -O2 -Wall -Wextra -o "$D/usr/local/bin/droiddeck-clipboard" tools/linuxfs/clipboard/clipboard.c -ldl
          aarch64-linux-gnu-strip --strip-unneeded "$D/usr/local/bin/droiddeck-clipboard"
          for script in tools/linuxfs/overlay/usr/local/bin/droiddeck-* tools/linuxfs/overlay/usr/local/bin/steam-compatibility; do
            install -Dm644 "$script" "$D/usr/local/bin/$(basename "$script")"
          done
          for f in tools/linuxfs/overlay/usr/bin/* tools/linuxfs/overlay/usr/bin/steamos-polkit-helpers/*; do
            [ -f "$f" ] && install -Dm644 "$f" "$D/${f#tools/linuxfs/overlay/}"
          done
          # CJK font and fontconfig fallback (zh overlay)
          for f in $(cd tools/linuxfs/overlay && find usr/share/fonts etc/fonts -type f 2>/dev/null); do
            install -Dm644 "tools/linuxfs/overlay/$f" "$D/$f"
          done
          if [ -f tools/gamescope/release.env ]; then
            . tools/gamescope/release.env
            gh release download "${GAMESCOPE_TAG}" -R "${GAMESCOPE_REPO:-${GITHUB_REPOSITORY}}" -p gamescope.tzst -O gamescope.tzst
            echo "${GAMESCOPE_SHA256}  gamescope.tzst" | sha256sum -c -
            tar --use-compress-program=unzstd -xf gamescope.tzst -C "$D"
            test -f "$D/usr/local/bin/gamescope"
            rm gamescope.tzst
          fi
          if [ -f tools/wlroots/release.env ]; then
            . tools/wlroots/release.env
            gh release download "${WLROOTS_TAG}" -R "Droid-Deck/DroidDeck" -p wlroots.tzst -O wlroots.tzst
            echo "${WLROOTS_SHA256}  wlroots.tzst" | sha256sum -c -
            tar --use-compress-program=unzstd -xf wlroots.tzst -C "$D"
            test -f "$D/usr/local/lib/droiddeck-wlroots/libwlroots-0.20.so"
            rm wlroots.tzst
          fi
          . tools/linuxfs/uruntime.env
          curl -fsSL --retry 3 -o uruntime "https://github.com/VHSgunzo/uruntime/releases/download/${URUNTIME_VERSION}/${URUNTIME_ASSET}"
          echo "${URUNTIME_SHA256}  uruntime" | sha256sum -c -
          install -Dm644 uruntime "$D/usr/local/lib/droiddeck/uruntime"
          install -Dm644 tools/linuxfs/licenses/uruntime-LICENSE "$D/usr/local/share/licenses/uruntime/LICENSE"
          rm uruntime
          M="$D/usr/local/lib/mangoapp"
          mkdir -p "$M" mango-pkgs
          grep -v '^#' tools/mangoapp/packages.txt | while read -r sum url; do
            [ -n "$url" ] || continue
            curl -fsSL --retry 3 -o mango-pkgs/pkg.tar.zst "$url"
            echo "$sum  mango-pkgs/pkg.tar.zst" | sha256sum -c -
            tar --use-compress-program=unzstd -xf mango-pkgs/pkg.tar.zst -C mango-pkgs
            rm mango-pkgs/pkg.tar.zst
          done
          install -m644 mango-pkgs/usr/bin/mangoapp "$M/mangoapp"
          for so in libfmt.so.10 libspdlog.so.1.13 libglfw.so.3 libtraceevent.so.1; do
            cp -L "mango-pkgs/usr/lib/$so" "$M/$so"
          done
          # Ours, not the package's: GPU memory without tracefs (tools/mangoapp/libtracefs-shim.c).
          aarch64-linux-gnu-gcc -shared -fPIC -O2 -Wall -Wl,-soname,libtracefs.so.1 \
            -o "$M/libtracefs.so.1" tools/mangoapp/libtracefs-shim.c
          aarch64-linux-gnu-strip --strip-unneeded "$M/libtracefs.so.1"
          install -Dm644 tools/mangoapp/mangoapp "$D/usr/local/bin/mangoapp"
          rm -rf mango-pkgs
          ls -l "$M"
          # The Windows components installer's tools (tools/msitools/packages.txt).
          T="$D/usr/local/lib/droiddeck-msitools"
          mkdir -p "$T" msi-pkgs
          grep -v '^#' tools/msitools/packages.txt | while read -r sum url; do
            [ -n "$url" ] || continue
            curl -fsSL --retry 3 -o msi-pkgs/pkg.tar.xz "$url"
            echo "$sum  msi-pkgs/pkg.tar.xz" | sha256sum -c -
            tar -xJf msi-pkgs/pkg.tar.xz -C msi-pkgs
            rm msi-pkgs/pkg.tar.xz
          done
          install -m644 msi-pkgs/usr/bin/msiinfo "$T/msiinfo"
          install -m644 msi-pkgs/usr/bin/cabextract "$T/cabextract"
          for so in libmsi-1.0.so.0 libgsf-1.so.114 libgcab-1.0.so.0; do
            cp -L "msi-pkgs/usr/lib/$so" "$T/$so"
          done
          for f in NOTICE GPL-2 GPL-3 LGPL-2.1; do
            install -Dm644 "tools/msitools/licenses/$f" "$D/usr/local/share/licenses/droiddeck-msitools/$f"
          done
          rm -rf msi-pkgs
          ls -l "$T"
          install -Dm644 tools/linuxfs/desktop/droiddeck-desktop "$D/usr/local/bin/droiddeck-desktop"
          install -Dm644 tools/linuxfs/desktop/droiddeck-gpu "$D/usr/local/bin/droiddeck-gpu"
          install -Dm644 tools/linuxfs/desktop/droiddeck-desktop-gpu "$D/usr/local/bin/droiddeck-desktop-gpu"
          install -Dm644 tools/linuxfs/desktop/autostart "$D/etc/xdg/labwc/autostart"
          install -Dm644 tools/linuxfs/desktop/rc.xml "$D/etc/xdg/labwc/rc.xml"
          install -Dm644 tools/linuxfs/desktop/panel.conf "$D/etc/xdg/lxqt/panel.conf"
          install -Dm644 tools/linuxfs/desktop/firefox-droiddeck.js "$D/usr/lib/firefox/defaults/pref/droiddeck.js"
          ls -lR "$D"

      - name: Build the x86 preloads FEX guests load (glibc 2.31)
        if: steps.preloads.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src" -w /src debian:bullseye bash -c '
            set -euo pipefail
            printf "deb http://archive.debian.org/debian bullseye main\ndeb http://archive.debian.org/debian-security bullseye-security main\n" > /etc/apt/sources.list
            apt-get -o Acquire::Check-Valid-Until=false update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends gcc g++ gcc-multilib g++-multilib binutils >/dev/null
            tools/linuxfs/build-x86-preloads.sh app/src/main/assets/linuxfs
          '
          sudo chown -R "$(id -u):$(id -g)" app/src/main/assets/linuxfs
          ls -l app/src/main/assets/linuxfs/x86_64 app/src/main/assets/linuxfs/i386

      - name: Bundle the droiddeck-esync packs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f tools/droiddeck-esync/release.env ]; then
            . tools/droiddeck-esync/release.env
            gh release download "$SYNC_BUNDLE_TAG" -R "$SYNC_BUNDLE_REPO" -p "$SYNC_BUNDLE_ASSET" -O sync-bundle.tzst
            echo "$SYNC_BUNDLE_SHA256  sync-bundle.tzst" | sha256sum -c -
            mkdir -p app/src/main/assets/droiddeck-esync
            tar --use-compress-program=unzstd -xf sync-bundle.tzst -C app/src/main/assets/droiddeck-esync
            rm sync-bundle.tzst
            gh release download "$SYNC_BUNDLE_TAG" -R "$SYNC_BUNDLE_REPO" -p index.json -O sync-index.json
            revoked=$(python3 -c 'import json, sys; print(" ".join(p["id"] for p in json.load(open(sys.argv[1]))["packs"] if p.get("revoked") is True))' sync-index.json)
            for id in $revoked; do
              if [ -e "app/src/main/assets/droiddeck-esync/packs/$id.tzst" ]; then
                echo "::warning::$SYNC_BUNDLE_ASSET carries revoked pack $id; it is left out of the APK (point tools/droiddeck-esync/release.env at a newer bundle)"
                rm -f "app/src/main/assets/droiddeck-esync/packs/$id.tzst"
              fi
            done
            rm sync-index.json
            test -f app/src/main/assets/droiddeck-esync/index.json
            test -f app/src/main/assets/droiddeck-esync/index.json.sig
            ls -lR app/src/main/assets/droiddeck-esync
          fi

      - name: Cache PulseAudio 13.0 source
        id: pa-src
        uses: actions/cache@v4
        with:
          path: pa13
          key: pulseaudio-src-13.0
      - name: Fetch PulseAudio 13.0 source
        if: steps.pa-src.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o pa.tar.gz https://github.com/pulseaudio/pulseaudio/archive/refs/tags/v13.0.tar.gz
          mkdir -p pa13 && tar -xzf pa.tar.gz -C pa13 --strip-components=1 && rm pa.tar.gz
      # DirectAudio - the game driver (one set per Wine audio interface), the Android-side helper and
      # the Steam client's sinks - comes from a pinned release of The412Banner/directaudio, checksummed,
      # exactly like gamescope; nothing compiled for audio is kept in this repo.
      - name: Fetch DirectAudio (tools/directaudio/release.env)
        run: tools/directaudio/fetch.sh "$PWD" "$PWD/sink-out"
      - name: Build the AAudio sink into the audio bundle
        run: |
          set -euo pipefail
          export NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}}"
          tools/aaudio-sink/build.sh "$PWD/pa13" "$PWD/sink-out"
          rm -rf pa-bundle && mkdir -p pa-bundle
          tar --use-compress-program=unzstd -xf app/src/main/assets/pulseaudio.tzst -C pa-bundle
          test ! -f pa-bundle/modules/arm64/module-aaudio-sink.so
          install -m755 sink-out/module-aaudio-sink.so pa-bundle/modules/arm64/module-aaudio-sink.so
          install -m755 sink-out/module-directaudio-native-sink.so pa-bundle/modules/arm64/module-directaudio-native-sink.so
          (cd pa-bundle && tar --use-compress-program='zstd -19' -cf ../pulseaudio.tzst .)
          mv pulseaudio.tzst app/src/main/assets/pulseaudio.tzst
          tar --use-compress-program=unzstd -tf app/src/main/assets/pulseaudio.tzst | grep -c '\.so$'
          rm -rf pa-bundle sink-out
      - name: Cache proot
        id: proot
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libproot.so
            app/src/main/jniLibs/arm64-v8a/libproot-loader.so
          key: proot-${{ env.NDK_VERSION }}-${{ hashFiles('tools/proot/**') }}
      - name: Build proot
        if: steps.proot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          export NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}}"
          tools/proot/build.sh app/src/main/jniLibs/arm64-v8a

      - name: Check the preloads
        run: |
          set -euo pipefail
          D=app/src/main/assets/linuxfs
          NEED=$(readelf -d "$D/libfakeinput.so" | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p')
          for bad in libstdc++.so.6 libgcc_s.so.1; do
            if printf '%s\n' "$NEED" | grep -qx "$bad"; then
              echo "::error::libfakeinput.so links $bad - the C++ runtime must stay static"; exit 1
            fi
          done
          syms() { readelf -Ws "$1" | awk '$4 == "FUNC" && $5 == "GLOBAL" {sub(/@.*/, "", $8); print $8}'; }
          FAKE=$(syms "$D/libfakeinput.so")
          for sym in open openat ioctl read close poll ppoll select stat fstat access scandir; do
            grep -qx "$sym" <<<"$FAKE" || { echo "::error::libfakeinput.so does not export $sym"; exit 1; }
          done
          # The static C++ runtime stays private: every session process preloads this library,
          # and an exported personality routine takes over other programs' unwinding (shadPS4
          # aborted in pthread_exit).
          if grep -qxE '__gxx_personality_v0|__cxa_throw|_Unwind_Resume' <<<"$FAKE"; then
            echo "::error::libfakeinput.so exports the C++ runtime"; exit 1
          fi
          SESSION=$(syms "$D/libblsession.so")
          for sym in socket bind getsockname setsockopt statfs statvfs syscall shm_open shm_unlink mmap mmap64 munmap drmPrimeFDToHandle drmCloseBufferHandle; do
            grep -qx "$sym" <<<"$SESSION" || { echo "::error::libblsession.so does not export $sym"; exit 1; }
          done
          # Zink's GEM_CLOSE is caught at ioctl(); an exported drmIoctl made NMS replay old frames.
          if grep -qx drmIoctl <<<"$SESSION"; then
            echo "::error::libblsession.so exports drmIoctl"; exit 1
          fi
          SSBS=$(syms "$D/libssbs.so")
          for sym in sigaction signal bsd_signal sysv_signal; do
            grep -qx "$sym" <<<"$SSBS" || { echo "::error::libssbs.so does not export $sym"; exit 1; }
          done
          test -f "$D/usr/local/bin/droiddeck-session"
          test -f "$D/usr/local/bin/droiddeck-proton-extra"
          test -f "$D/usr/local/bin/droiddeck-msi-install"
          for f in msiinfo cabextract libmsi-1.0.so.0 libgsf-1.so.114 libgcab-1.0.so.0; do
            test -f "$D/usr/local/lib/droiddeck-msitools/$f" || { echo "::error::droiddeck-msitools/$f missing"; exit 1; }
          done

      - name: Cache the CMake build tree
        uses: actions/cache@v4
        with:
          path: |
            app/.cxx
            app/build/intermediates/cxx
          key: cxx-${{ env.NDK_VERSION }}-${{ hashFiles('app/src/main/cpp/**') }}
          restore-keys: |
            cxx-${{ env.NDK_VERSION }}-

      - name: Build
        id: build
        env:
          DROIDDECK_BUILD_LABEL: ${{ steps.build-label.outputs.label }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --console=plain -PndkVersion="$NDK_VERSION" 2>&1 | tee /tmp/build.log
          python3 tools/release/check_session_assets.py app/build/outputs/apk/release/app-release.apk

      - name: Steam import and game environment tests
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'

      - name: Unit tests
        run: ./gradlew testReleaseUnitTest --console=plain -PndkVersion="$NDK_VERSION"

      - name: Check the native dependency closure
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          WORK=$(mktemp -d)
          unzip -q "$APK" 'lib/arm64-v8a/*' -d "$WORK"
          cd "$WORK/lib/arm64-v8a"
          SYSTEM="libc.so libm.so libdl.so liblog.so libandroid.so libz.so libvulkan.so libstdc++.so
                  libGLESv2.so libEGL.so libnativewindow.so libjnigraphics.so libaaudio.so
                  libOpenSLES.so libmediandk.so libcamera2ndk.so libsync.so libneuralnetworks.so"
          fail=0
          for so in *.so; do
            for need in $(readelf -d "$so" | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p'); do
              [ -f "$need" ] && continue
              case " $(echo $SYSTEM) " in *" $need "*) continue ;; esac
              echo "::error::$so needs $need, which is neither in the apk nor a platform library"
              fail=1
            done
          done
          exit $fail

      - name: Sign with the testkey (v1 + v2 + v3)
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -1)
          "$TOOLS/zipalign" -p -f 4 "$APK" "$APK.aligned"
          "$TOOLS/apksigner" sign \
            --ks keystore/testkey.p12 --ks-type PKCS12 --ks-pass pass:android \
            --ks-key-alias testkey --key-pass pass:android \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "$APK" "$APK.aligned"
          rm -f "$APK.aligned" "$APK.idsig"

      - name: Check the signature
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --min-sdk-version 21 --verbose --print-certs "$APK" | tee /tmp/sig.txt
          unzip -l "$APK" | grep -qE 'META-INF/.*\.(SF|RSA|DSA)$' \
            || { echo "::error::apk carries no JAR signature files"; exit 1; }
          for scheme in "v1 scheme (JAR signing): true" "v2 scheme (APK Signature Scheme v2): true" \
                        "v3 scheme (APK Signature Scheme v3): true"; do
            grep -qF "$scheme" /tmp/sig.txt || { echo "::error::apk is not signed with $scheme"; exit 1; }
          done
          grep -qi "CN=Android, OU=Android, O=Android" /tmp/sig.txt \
            || { echo "::error::apk is not signed with the AOSP testkey"; exit 1; }

      - name: Report on the pull request
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -uo pipefail
          MARK="<!-- droiddeck-pr-build -->"
          {
            echo "$MARK"
            echo "## Build of this pull request"
            echo
            [ -f /tmp/pr-merge.md ] && cat /tmp/pr-merge.md
            echo
            case "$BUILD_OUTCOME" in
              success)
                echo "###  Build passed"
                echo
                echo "The \`droiddeck-apk\` artifact is [on this run]($RUN_URL), signed with the public test key."
                echo
                echo "Preview builds are published automatically from main. This PR's APK is on the run above."
                echo
                ;;
              failure)
                echo "### ERROR: Build failed"
                echo
                echo "The compiler's errors ([full log]($RUN_URL)):"
                echo
                echo '```'
                { grep -E '^e: |^w: .*error|error:|CMake Error|fatal error|ninja: error|FAILED|What went wrong|Execution failed for task|Unresolved reference|Type mismatch|Unresolved' /tmp/build.log 2>/dev/null \
                  | sed -e 's#file:///home/runner/work/[^/]*/[^/]*/##' -e 's#/home/runner/work/[^/]*/[^/]*/##' \
                  | grep -v '^w: ' | awk '!seen[$0]++' | head -80; } || true
                echo '```'
                echo
                echo "<details><summary>What went wrong (Gradle)</summary>"
                echo
                echo '```'
                awk '/^\* What went wrong/{p=1} /^\* Try:/{p=0} p{print}' /tmp/build.log 2>/dev/null | head -60
                echo '```'
                echo "</details>"
                ;;
              skipped|cancelled)
                echo "###  Not built"
                echo
                echo "The build did not run (see above, or [the run]($RUN_URL))."
                ;;
            esac
            echo
          } > /tmp/pr-report.md
          cat /tmp/pr-report.md >> "$GITHUB_STEP_SUMMARY"
          ID=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate --jq ".[] | select(.body | startswith(\"$MARK\")) | .id" | head -1 || true)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${ID}" -F body=@/tmp/pr-report.md >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F body=@/tmp/pr-report.md >/dev/null
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: droiddeck-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  # Each main build published as a prerelease (main-<sha>, last 10 kept).
  announce:
    needs: [build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    env:
      KEEP: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: droiddeck-apk
          path: signed

      - name: Publish prerelease
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ *versionName "\(.*\)"$/\1/p' app/build.gradle)
          sha7=${GITHUB_SHA::7}
          tag="${version}-${sha7}"
          subject=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.commit.message | split("\n")[0]')
          cd signed
          sha256sum *.apk > SHA256SUMS.txt
          cd ..
          notes="## ${version} (${sha7})

          ${subject}

          基于上游 DroidDeck 源码编译的中文优化版。

          ### 本次变更
          - 详见 commit: \`${sha7}\`

          ### 独家功能
          - 竖屏适配（管理界面跟随系统旋转，游戏会话保持横屏）
          - 中文字体注入（文泉驿微米黑兜底，Steam 中文不显示口口口）
          - 退出 Steam 登录按钮（主页设置旁，只清凭证保留设置）
          - 国内 Steam 下载区域预设（首次启动自动设置）
          - 汉化声明弹窗

          ### 注意
          - 签名使用上游公开 testkey，与原版签名一致，支持就地更新
          - 此为预发布版，仅供测试验证

          SHA-256:
          \`\`\`
          $(cat signed/SHA256SUMS.txt)
          \`\`\`"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" --target main --prerelease \
            --title "${version} 预发布 (${sha7})" --notes "$notes" signed/*
          # Keep newest 5 prereleases
          gh release list -L 200 --json tagName,publishedAt,isPrerelease \
            --jq '[.[] | select(.isPrerelease)] | sort_by(.publishedAt) | reverse | .['"$KEEP"':][] | .tagName' |
            while IFS= read -r old; do
              [ "$old" = "$tag" ] && continue
              gh release delete "$old" --yes --cleanup-tag 2>/dev/null || true
            done
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag"
          apk=$(cd signed && ls *.apk | head -1)
          echo "release=$url" >> "$GITHUB_OUTPUT"
          echo "apk=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/$apk" >> "$GITHUB_OUTPUT"
          echo "Published $url"

      - name: Update catalog.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          signer=$(cat keystore/release-signer.sha256 | tr 'A-F' 'a-f')
          version=$(sed -n 's/^ *versionName "\(.*\)"$/\1/p' app/build.gradle)
          versionCode=$(sed -n 's/^ *versionCode \([0-9]*\)$/\1/p' app/build.gradle)
          # Give the Releases API a moment to index the release we just created.
          sleep 5
          # Build catalog from this repo's releases: latest non-prerelease = stable,
          # latest prerelease = preview. Tests are left empty (no PR test builds yet).
          python3 - "$GITHUB_REPOSITORY" "$version" "$versionCode" "$signer" << 'PY'
          import json, subprocess, sys, os, re
          from datetime import datetime, timezone
          repo, version, versionCode, signer = sys.argv[1:5]
          def gh(args):
              return subprocess.run(["gh","api",args], capture_output=True, text=True, check=True).stdout
          def to_ms(iso_str):
              try:
                  dt = datetime.fromisoformat(iso_str.replace("Z","+00:00"))
                  return int(dt.timestamp() * 1000)
              except Exception:
                  return 0
          releases = json.loads(gh(f"repos/{repo}/releases?per_page=100"))
          # Sort by published_at descending so the newest is always picked, regardless of API order.
          releases.sort(key=lambda r: to_ms(r.get("published_at","")), reverse=True)
          # stable = newest non-prerelease release that ships an APK (data-packages only
          # has a linuxfs archive and must never be treated as an app update).
          stable = next((r for r in releases
                         if not r["prerelease"] and not r["draft"]
                         and r["tag_name"] != "data-packages"
                         and any(a["name"].endswith(".apk") for a in r.get("assets", []))), None)
          preview = next((r for r in releases if r["prerelease"] and not r["draft"]), None)
          def mk_release(r):
              if not r: return None
              asset = next((a for a in r["assets"] if a["name"].endswith(".apk")), None)
              apks = {}
              if asset:
                  apks["com.droiddeck.launcher"] = {
                      "name": asset["name"],
                      "url": asset["browser_download_url"],
                      "size": asset["size"],
                      "sha256": "",  # filled from SHA256SUMS if present
                      "packageName": "com.droiddeck.launcher",
                      "versionCode": int(versionCode),
                      "signerSha256": signer,
                  }
                  # Try to read sha256 from SHA256SUMS.txt asset
                  sha_asset = next((a for a in r["assets"] if a["name"] == "SHA256SUMS.txt"), None)
                  if sha_asset:
                      import urllib.request
                      try:
                          txt = urllib.request.urlopen(sha_asset["browser_download_url"]).read().decode()
                          for line in txt.strip().splitlines():
                              parts = line.split()
                              if len(parts) >= 2 and parts[1] == asset["name"]:
                                  apks["com.droiddeck.launcher"]["sha256"] = parts[0].lower()
                      except Exception:
                          pass
              tag = r["tag_name"]
              commit = ""
              try:
                  commitish = json.loads(gh(f"repos/{repo}/releases/tags/{tag}"))["target_commitish"]
                  # target_commitish may be a branch name; resolve it to a real SHA.
                  if re.fullmatch(r"[0-9a-fA-F]{40}", commitish or ""):
                      commit = commitish
                  else:
                      commit = json.loads(gh(f"repos/{repo}/commits/{commitish}"))["sha"]
              except Exception:
                  pass
              return {
                  "tag": tag,
                  "title": r.get("name") or tag,
                  "summary": (r.get("body") or "")[:500],
                  "commit": commit or "0"*40,
                  "pr": 0,
                  "version": version if r["prerelease"] else tag.lstrip("v"),
                  "versionCode": int(versionCode),
                  "publishedAt": to_ms(r["published_at"]),
                  "url": r["html_url"],
                  "apks": apks,
              }
          catalog = {
              "schema": 1,
              "sourceRepo": repo,
              "ciRepo": repo,
              "stable": mk_release(stable),
              "preview": mk_release(preview),
              "tests": [],
              "recentPreviews": [],
          }
          os.makedirs("/tmp/catalog", exist_ok=True)
          with open("/tmp/catalog/catalog.json","w") as f:
              json.dump(catalog, f, indent=2, ensure_ascii=False)
          print(f"catalog: stable={catalog['stable']['tag'] if catalog['stable'] else None}, preview={catalog['preview']['tag'] if catalog['preview'] else None}")
          PY
          # Push catalog.json to catalog branch
          cd /tmp/catalog
          git init -q
          git config user.email "mihsian77@users.noreply.github.com"
          git config user.name "mihsian77"
          git add catalog.json
          git commit -q -m "catalog: update channels"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:catalog
          echo "catalog.json pushed to catalog branch"
